trigger:
  branches:
    include: [main]
  paths:
    include: [app/*]

variables:
  serviceConnection: sc-azure-wif
  environment: dev
  rg: rg-assign-dev
  appName: ca-assign-dev
  imageName: demo-api

pool:
  vmImage: ubuntu-latest

steps:
  - task: AzureCLI@2
    displayName: Resolve ACR + build image
    inputs:
      azureSubscription: $(serviceConnection)
      scriptType: bash
      scriptLocation: inlineScript
      inlineScript: |
        ACR=$(az acr list -g $(rg) --query "[0].name" -o tsv)
        LOGIN_SERVER=$(az acr show -n $ACR --query loginServer -o tsv)
        IMAGE=$LOGIN_SERVER/$(imageName):$(Build.BuildId)
        echo "##vso[task.setvariable variable=ACR]$ACR"
        echo "##vso[task.setvariable variable=IMAGE]$IMAGE"
        docker build -t $IMAGE ./app

  - bash: |
      curl -sfL https://raw.githubusercontent.com/aquasecurity/trivy/main/contrib/install.sh \
        | sudo sh -s -- -b /usr/local/bin
      trivy image --severity CRITICAL,HIGH --ignore-unfixed --exit-code 1 $(IMAGE)
    displayName: Trivy image scan (bonus)

  - task: AzureCLI@2
    displayName: Push to ACR
    inputs:
      azureSubscription: $(serviceConnection)
      scriptType: bash
      scriptLocation: inlineScript
      inlineScript: |
        az acr login -n $(ACR)
        docker push $(IMAGE)

  - task: AzureCLI@2
    displayName: Deploy to Container Apps
    inputs:
      azureSubscription: $(serviceConnection)
      scriptType: bash
      scriptLocation: inlineScript
      inlineScript: |
        az config set extension.use_dynamic_install=yes_without_prompt
        az containerapp update -n $(appName) -g $(rg) \
          --image $(IMAGE) \
          --set-env-vars APP_VERSION=$(Build.BuildId)

  - task: AzureCLI@2
    displayName: Smoke test
    inputs:
      azureSubscription: $(serviceConnection)
      scriptType: bash
      scriptLocation: inlineScript
      inlineScript: |
        FQDN=$(az containerapp show -n $(appName) -g $(rg) \
               --query properties.configuration.ingress.fqdn -o tsv)
        echo "Deployed URL: https://$FQDN"
        curl -fsS --retry 12 --retry-delay 10 --retry-all-errors https://$FQDN/health
        curl -fsS https://$FQDN/api/info